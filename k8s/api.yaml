apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: geostack
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: geostack-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: geostack-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: geostack-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: geostack-config
                  key: POSTGRES_DB
            - name: DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres.infra:5432/$(POSTGRES_DB)"
            - name: JWT_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: geostack-config
                  key: JWT_ISSUER
            - name: MINIO_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: geostack-config
                  key: MINIO_ENDPOINT
            - name: MINIO_PORT
              valueFrom:
                configMapKeyRef:
                  name: geostack-config
                  key: MINIO_PORT
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: geostack-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: geostack-secrets
                  key: MINIO_ROOT_PASSWORD
            - name: MINIO_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: geostack-config
                  key: MINIO_BUCKET
            - name: MARTIN_URL
              valueFrom:
                configMapKeyRef:
                  name: geostack-config
                  key: MARTIN_URL
            - name: TITILER_URL
              valueFrom:
                configMapKeyRef:
                  name: geostack-config
                  key: TITILER_URL
            - name: GEOSERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: geostack-config
                  key: GEOSERVER_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: geostack-secrets
                  key: JWT_SECRET
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: geostack
spec:
  selector:
    app: api
  ports:
    - port: 3000
      targetPort: 3000
