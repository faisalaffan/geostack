apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: geostack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: geostack-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5173
          env:
            - name: VITE_API_URL
              valueFrom:
                configMapKeyRef:
                  name: geostack-config
                  key: VITE_API_URL
            - name: VITE_KEYCLOAK_URL
              valueFrom:
                configMapKeyRef:
                  name: geostack-config
                  key: VITE_KEYCLOAK_URL
            - name: VITE_KEYCLOAK_REALM
              valueFrom:
                configMapKeyRef:
                  name: geostack-config
                  key: VITE_KEYCLOAK_REALM
            - name: VITE_KEYCLOAK_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: geostack-config
                  key: VITE_KEYCLOAK_CLIENT_ID
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: geostack
spec:
  selector:
    app: web
  ports:
    - port: 5173
      targetPort: 5173
