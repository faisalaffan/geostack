apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: geostack-ingress
  namespace: geostack
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
spec:
  ingressClassName: nginx
  rules:
    - host: geostack.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 5173
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3000
          - path: /geoserver
            pathType: Prefix
            backend:
              service:
                name: geoserver
                port:
                  number: 8080
